<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0620">
<title>Glowbird</title>
<style>
  :root{
    --bg:#0b0620; --pink:#ff3d9a; --cyan:#29f0ff; --yellow:#ffd23d; --violet:#8a5cff;
    --glass:rgba(20,10,48,.55); --line:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px 16px calc(24px + env(safe-area-inset-bottom));pointer-events:none;opacity:0;transition:opacity .35s}
  .screen.on{opacity:1;pointer-events:auto}
  .screen.on .pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes pop{from{transform:scale(.6) translateY(30px);opacity:0}to{transform:none;opacity:1}}

  /* ---------- MENU ---------- */
  .title{font-size:min(14.5vw,76px);font-weight:900;letter-spacing:.02em;line-height:1;margin:0 0 4px;display:flex}
  .title span{display:inline-block;animation:bob 1.6s ease-in-out infinite;
    background:linear-gradient(180deg,#fff 10%,var(--yellow) 45%,var(--pink) 95%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 #5a1a7a) drop-shadow(0 0 18px rgba(255,61,154,.7))}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
  .subtitle{font-size:14px;letter-spacing:.35em;color:var(--cyan);text-shadow:0 0 10px var(--cyan);margin-bottom:22vh;font-weight:700}
  .stats{display:flex;gap:10px;margin-bottom:18px}
  .chip{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:800;font-size:15px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;gap:8px;align-items:center}
  .chip b{color:var(--yellow)}
  .btn{border:0;cursor:pointer;font:inherit;font-weight:900;color:#fff;letter-spacing:.06em;
    border-radius:20px;padding:16px 28px;min-width:230px;font-size:22px;position:relative;margin:7px 0;
    background:linear-gradient(180deg,#ff6fb5,var(--pink) 55%,#c4106a);box-shadow:0 6px 0 #7a0d47,0 10px 30px rgba(255,61,154,.45);
    transition:transform .08s, box-shadow .08s}
  .btn:active{transform:translateY(5px);box-shadow:0 1px 0 #7a0d47,0 4px 14px rgba(255,61,154,.4)}
  .btn.big{font-size:30px;padding:18px 28px;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
  .btn.alt{background:linear-gradient(180deg,#5df6ff,#18b9d6 55%,#0b7f9e);box-shadow:0 6px 0 #064a5e,0 10px 30px rgba(41,240,255,.35)}
  .btn.alt:active{box-shadow:0 1px 0 #064a5e}
  .btn.ghost{background:var(--glass);box-shadow:0 6px 0 rgba(0,0,0,.35);border:1px solid var(--line);font-size:18px;min-width:0;padding:12px 20px}
  .row{display:flex;gap:10px;justify-content:center}
  .row .btn{min-width:0;flex:1}

  /* ---------- PANELS ---------- */
  .panel{background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:22px 18px;width:min(92vw,380px);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center}
  .panel h2{margin:0 0 14px;font-size:30px;font-weight:900;letter-spacing:.04em;color:var(--yellow);text-shadow:0 3px 0 #7a3d00,0 0 20px rgba(255,210,61,.5)}
  .skins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .skin{border-radius:18px;background:rgba(255,255,255,.06);border:2px solid transparent;padding:8px 4px 6px;position:relative}
  .skin.sel{border-color:var(--cyan);box-shadow:0 0 18px rgba(41,240,255,.5)}
  .skin canvas{position:static;width:64px;height:64px}
  .skin .nm{font-size:12px;font-weight:800;opacity:.9}
  .skin .lock{position:absolute;inset:0;border-radius:16px;background:rgba(10,5,25,.72);display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-weight:900;font-size:14px;gap:2px}
  .toggle{display:flex;justify-content:space-between;align-items:center;padding:14px 6px;border-bottom:1px solid var(--line);font-weight:800;font-size:18px}
  .sw{width:58px;height:32px;border-radius:999px;background:#3a2b5e;position:relative;transition:background .2s}
  .sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
  .sw.on{background:var(--pink)}.sw.on::after{transform:translateX(26px)}

  /* ---------- HUD ---------- */
  #hud{position:fixed;top:0;left:0;right:0;padding:calc(18px + env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;opacity:0;transition:opacity .25s}
  #hud.on{opacity:1}
  #hud:not(.on) #pauseBtn{pointer-events:none}
  #pauseBtn{pointer-events:auto;width:48px;height:48px;border-radius:16px;background:var(--glass);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;gap:6px}
  #pauseBtn i{width:6px;height:20px;background:#fff;border-radius:2px;display:block}
  #gemHud{font-weight:900;font-size:18px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:10px 14px}
  #gemHud b{color:var(--cyan)}

  /* ---------- GAME OVER ---------- */
  .medal{width:92px;height:92px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;
    box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 0 30px currentColor;animation:spin 2.5s ease-in-out infinite}
  @keyframes spin{0%,100%{transform:rotateY(0)}50%{transform:rotateY(180deg)}}
  .scores{display:flex;justify-content:space-around;margin:12px 0 18px}
  .scores div{font-size:13px;font-weight:800;letter-spacing:.15em;opacity:.85}
  .scores b{display:block;font-size:44px;letter-spacing:0;opacity:1;line-height:1.1}
  .newbest{display:inline-block;background:var(--pink);border-radius:8px;padding:3px 10px;font-weight:900;font-size:13px;letter-spacing:.1em;
    animation:wig .5s ease-in-out infinite alternate;margin-bottom:6px}
  @keyframes wig{from{transform:rotate(-6deg) scale(1)}to{transform:rotate(6deg) scale(1.12)}}
  .hint{font-weight:900;font-size:22px;letter-spacing:.1em;text-shadow:0 3px 0 rgba(0,0,0,.4);animation:pulse 1s infinite,bob 1.2s ease-in-out infinite;margin-top:34vh}
  .hidden{display:none!important}
  .btn{line-height:1.15}
  .row .btn{font-size:min(20px,5vw);padding:16px 10px;white-space:nowrap}
  .row .btn.ghost{flex:0 0 64px;font-size:22px}
  .panel h2{font-size:min(30px,7.4vw)}
  .langval{font-size:15px;color:var(--cyan);background:rgba(255,255,255,.08);border-radius:999px;padding:6px 12px}
  .langs{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:56vh;overflow-y:auto;margin-bottom:14px;padding:2px;touch-action:pan-y}
  .lang{border-radius:14px;background:rgba(255,255,255,.07);border:2px solid transparent;padding:12px 6px;font-weight:800;font-size:16px}
  .lang.sel{border-color:var(--cyan);box-shadow:0 0 14px rgba(41,240,255,.45);color:var(--cyan)}
  .title,.scores b,.chip b{direction:ltr;unicode-bidi:isolate}
  .btn.vio{background:linear-gradient(180deg,#b28cff,var(--violet) 55%,#5a2fd6);box-shadow:0 6px 0 #33188a,0 10px 30px rgba(138,92,255,.4)}
  .btn.vio:active{box-shadow:0 1px 0 #33188a}
  .row .btn.ghost{flex:1}
  .badge{position:absolute;top:-8px;right:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--yellow);color:#2a0b45;font-style:normal;font-size:14px;line-height:24px;padding:0 6px;box-shadow:0 0 12px var(--yellow);animation:wig .5s ease-in-out infinite alternate}
  .mlist{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  .mcard{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:start}
  .mcard .d{font-weight:800;font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .mcard .rw{color:var(--cyan);white-space:nowrap;direction:ltr}
  .bar{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--yellow));border-radius:99px;box-shadow:0 0 10px var(--pink)}
  .mcard .pg{font-size:12px;opacity:.75;margin-top:5px;text-align:end;direction:ltr}
  /* ---------- v1.4 ---------- */
  .row.small{width:min(92vw,300px)}
  .row.small .btn.ghost{flex:1;font-size:22px;padding:12px 0}
  .skins{max-height:46vh;overflow-y:auto;touch-action:pan-y;padding:2px}
  .tabs{display:flex;gap:6px;background:rgba(0,0,0,.25);border-radius:14px;padding:4px;margin-bottom:12px}
  .tab{flex:1;border-radius:10px;padding:9px 4px;font-weight:900;font-size:14px;letter-spacing:.05em;opacity:.6}
  .tab.on{background:var(--pink);opacity:1;box-shadow:0 0 14px rgba(255,61,154,.5)}
  .days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .day{border-radius:14px;background:rgba(255,255,255,.06);border:2px solid transparent;padding:10px 2px;font-weight:800;font-size:12px;position:relative}
  .day b{display:block;font-size:17px;color:var(--cyan);margin-top:4px;direction:ltr}
  .day.got{opacity:.45}
  .day.got::after{content:"✓";position:absolute;top:2px;right:6px;color:#7dff4a;font-size:14px}
  .day.cur{border-color:var(--yellow);box-shadow:0 0 18px rgba(255,210,61,.55);animation:pulse 1s infinite}
  .day.big{grid-column:span 2}
  .dmsg{font-weight:800;opacity:.85;margin-bottom:6px;min-height:20px}
  .slist{text-align:start;margin-bottom:14px;max-height:52vh;overflow-y:auto;touch-action:pan-y}
  .srow{display:flex;justify-content:space-between;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
  .srow b{color:var(--yellow);direction:ltr}
  .medal{width:72px;height:72px;font-size:32px}
  .scores{margin:8px 0 12px}
  .over-row{display:flex;gap:10px;justify-content:center;width:100%}
  .over-row .btn{min-width:0;flex:1;font-size:min(17px,4.4vw);padding:13px 6px;white-space:nowrap}
  #replayTag{position:fixed;left:0;right:0;top:calc(14px + env(safe-area-inset-top));text-align:center;font-weight:900;letter-spacing:.3em;font-size:16px;
    color:#fff;text-shadow:0 0 12px #ff3355;pointer-events:none}
  #replayTag i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff3355;margin-inline-end:8px;animation:pulse .6s infinite;box-shadow:0 0 10px #ff3355}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud"><div id="gemHud">◆ <b id="gemCount">0</b></div><div id="pauseBtn"><i></i><i></i></div></div>
<div id="replayTag" class="hidden"><i></i><span data-i18n="replay"></span></div>

<!-- MENU -->
<div class="screen" id="menu">
  <h1 class="title pop" id="titleEl"></h1>
  <div class="subtitle pop" data-i18n="subtitle"></div>
  <div class="stats pop"><div class="chip">🏆 <b id="menuBest">0</b></div><div class="chip">◆ <b id="menuGems" style="color:var(--cyan)">0</b></div></div>
  <button class="btn big pop" id="playBtn" data-i18n="play"></button>
  <div class="row pop" style="width:min(92vw,330px)">
    <button class="btn alt" id="skinBtn" data-i18n="characters_btn"></button>
    <button class="btn vio" id="missionBtn"><span data-i18n="missions"></span><em class="badge hidden" id="mBadge"></em></button>
  </div>
  <div class="row small pop">
    <button class="btn ghost" id="dailyBtn">🎁<em class="badge hidden" id="dBadge">!</em></button>
    <button class="btn ghost" id="statsBtn">📊</button>
    <button class="btn ghost" id="langBtn">🌐</button>
    <button class="btn ghost" id="setBtn">⚙</button>
  </div>
</div>

<!-- READY -->
<div class="screen" id="ready"><div class="hint" data-i18n="ready"></div></div>

<!-- SKINS + HATS -->
<div class="screen" id="skins">
  <div class="panel pop">
    <div class="tabs"><div class="tab on" id="tabSkins" data-i18n="characters"></div><div class="tab" id="tabHats" data-i18n="hats"></div></div>
    <div class="chip" style="display:inline-flex;margin-bottom:12px">◆ <b id="skinGems" style="color:var(--cyan)">0</b></div>
    <div class="skins" id="skinGrid"></div>
    <button class="btn" id="skinBack" data-i18n="ok"></button>
  </div>
</div>

<!-- SETTINGS -->
<div class="screen" id="settings">
  <div class="panel pop">
    <h2 data-i18n="settings"></h2>
    <div class="toggle" data-k="music"><span data-i18n="music"></span> <div class="sw"></div></div>
    <div class="toggle" data-k="sound"><span data-i18n="sound"></span> <div class="sw"></div></div>
    <div class="toggle" data-k="vibe"><span data-i18n="vibration"></span> <div class="sw"></div></div>
    <div class="toggle" data-k="shake"><span data-i18n="shake"></span> <div class="sw"></div></div>
    <div class="toggle" data-k="fx"><span data-i18n="fx"></span> <div class="sw"></div></div>
    <div class="toggle" id="langRow" style="border:0"><span data-i18n="language"></span> <span class="langval" id="langName"></span></div>
    <button class="btn" id="setBack" style="margin-top:12px" data-i18n="ok"></button>
  </div>
</div>

<!-- MISSIONS -->
<div class="screen" id="missions">
  <div class="panel pop">
    <h2 data-i18n="missions"></h2>
    <div class="mlist" id="mList"></div>
    <div style="font-weight:800;opacity:.8;margin-bottom:12px"><span data-i18n="completed"></span>: <b id="mDone" style="color:var(--yellow)">0</b></div>
    <button class="btn" id="missionBack" data-i18n="ok"></button>
  </div>
</div>

<!-- DAILY -->
<div class="screen" id="daily">
  <div class="panel pop">
    <h2 data-i18n="daily"></h2>
    <div class="days" id="dayGrid"></div>
    <div class="dmsg" id="dailyMsg"></div>
    <button class="btn big" id="claimBtn" data-i18n="claim"></button>
    <button class="btn" id="dailyBack" data-i18n="ok"></button>
  </div>
</div>

<!-- STATS -->
<div class="screen" id="stats">
  <div class="panel pop">
    <h2 data-i18n="stats"></h2>
    <div class="slist" id="statList"></div>
    <button class="btn" id="statsBack" data-i18n="ok"></button>
  </div>
</div>

<!-- LANGUAGE -->
<div class="screen" id="langs">
  <div class="panel pop">
    <h2 data-i18n="language"></h2>
    <div class="langs" id="langGrid"></div>
    <button class="btn" id="langBack" data-i18n="ok"></button>
  </div>
</div>

<!-- PAUSE -->
<div class="screen" id="pause">
  <div class="panel pop">
    <h2 data-i18n="paused"></h2>
    <button class="btn big" id="resumeBtn" data-i18n="resume"></button><br>
    <button class="btn alt" id="quitBtn" data-i18n="menu"></button>
  </div>
</div>

<!-- GAME OVER -->
<div class="screen" id="over">
  <div class="panel pop">
    <h2 id="overTitle" data-i18n="gameover"></h2>
    <div id="newBest" class="newbest hidden" data-i18n="newbest"></div>
    <div class="medal" id="medal">★</div>
    <div id="medalName" style="font-weight:900;letter-spacing:.15em;font-size:13px;opacity:.85"></div>
    <div class="scores"><div><span data-i18n="score"></span><b id="finalScore">0</b></div><div><span data-i18n="best"></span><b id="finalBest">0</b></div></div>
    <div style="font-weight:800;margin:-6px 0 10px;opacity:.9">+◆ <span id="finalGems">0</span> <span data-i18n="crystals"></span></div>
    <button class="btn big" id="againBtn" data-i18n="retry"></button>
    <div class="over-row">
      <button class="btn vio" id="replayBtn">⏪ <span data-i18n="replay"></span></button>
      <button class="btn ghost" id="shareBtn">↗ <span data-i18n="share"></span></button>
    </div>
    <button class="btn alt" id="homeBtn" data-i18n="menu"></button>
  </div>
</div>

<script src="i18n.js"></script>
<script>
"use strict";
/* =========================================================
   GLOWBIRD — Neon Wings  (storage keys keep the old "pirpir." prefix so saves carry over)
   ========================================================= */
const cv = document.getElementById('c'), cx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const NATIVE = window.Android || null;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- persistence ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem('pirpir.'+k); return v===null? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem('pirpir.'+k, JSON.stringify(v)); }catch(e){} }
};
let best = store.get('best', 0), gems = store.get('gems', 0);
let settings = Object.assign({music:true, sound:true, vibe:true, shake:true, fx:true}, store.get('settings', {}));
let skinIdx = store.get('skin', 0), unlocked = store.get('unlocked', [0]);
let hatIdx = store.get('hat', 0), hatsOwned = store.get('hats', [0]);
let stats = Object.assign({games:0, points:0, crystals:0, near:0, saws:0, lasers:0, bosses:0, powers:0, time:0}, store.get('stats', {}));
const saveStats = () => store.set('stats', stats);

// trail: dots (default) | fire | snow | star | pixel
const SKINS = [
  {name:'Glowy',    body:'#ffd23d', belly:'#fff3b0', wing:'#ff8a3d', trail:'#ffd23d', cost:0},
  {name:'Neon',     body:'#29f0ff', belly:'#c8fcff', wing:'#8a5cff', trail:'#29f0ff', cost:15},
  {name:'Candy',    body:'#ff3d9a', belly:'#ffc2e0', wing:'#ffd23d', trail:'#ff3d9a', cost:40},
  {name:'Toxic',    body:'#7dff4a', belly:'#e0ffcf', wing:'#1fae6b', trail:'#7dff4a', cost:80},
  {name:'Midnight', body:'#4b3bb5', belly:'#a99bff', wing:'#1b1155', trail:'#a99bff', cost:150},
  {name:'Gold',     body:'#ffb800', belly:'#fff',    wing:'#fff1a8', trail:'#ffffff', cost:300, rainbow:true},
  {name:'Phoenix',  body:'#ff5a1f', belly:'#ffd23d', wing:'#ff2d2d', trail:'#ff8a1f', cost:120, fx:'fire'},
  {name:'Frost',    body:'#bfefff', belly:'#ffffff', wing:'#5ec8ff', trail:'#ffffff', cost:100, fx:'snow'},
  {name:'Star',     body:'#ffe36e', belly:'#fff8d6', wing:'#ff9de2', trail:'#ffe36e', cost:180, fx:'star'},
  {name:'Pixel',    body:'#3dff8a', belly:'#d6ffe6', wing:'#2a7bff', trail:'#3dff8a', cost:220, fx:'pixel'},
];
const HATS = [0, 20, 40, 120, 60, 90, 200];   // cost per hat; names come from tr('hat_names')

// ---------- sizing ----------
const H = 640;               // logical height
let W = 360, scale = 1, dpr = 1;
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  scale = cv.height / H; W = cv.width / scale;
  buildScenery();
}
addEventListener('resize', resize);

// ---------- audio (synthesized) ----------
let ac = null, master = null;
function audio(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination);}catch(e){}
  }
  if(ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f0, f1, dur, type='square', vol=.25, delay=0){
  if(!settings.sound || !audio()) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.02);
}
function noise(dur, vol=.3, freq=1000, delay=0){
  if(!settings.sound || !audio()) return;
  const t = ac.currentTime + delay, n = Math.floor(ac.sampleRate*dur), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = b; fl.type = 'lowpass'; fl.frequency.value = freq; g.gain.value = vol;
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t);
}
const semi = (f, s) => f * Math.pow(2, s/12);
const SFX = {
  flap(){ tone(380, 720, .09, 'triangle', .18); noise(.06, .08, 3000); },
  score(n){ const b = semi(660, n%12); tone(b, b, .08, 'square', .12); tone(b*1.5, b*1.5, .14, 'square', .12, .07); },

// ---------- music: a small synthwave sequencer, tempo follows the game ----------
const CHORDS = [   // [semitone root from A, minor?] — one progression per world
  [[0,1],[-4,0],[3,0],[-2,0]],
  [[7,1],[3,0],[10,0],[5,0]],
  [[5,1],[1,0],[8,0],[0,0]],
  [[0,1],[5,1],[-4,0],[-5,0]],
];
const Music = {
  gain:null, nb:null, timer:null, next:0, step:0,
  start(){
    if(!audio()) return;
    if(!this.gain){
      this.gain = ac.createGain(); this.gain.gain.value = 0; this.gain.connect(master);
      this.nb = ac.createBuffer(1, ac.sampleRate*.5, ac.sampleRate); const d = this.nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    }
    this.setVol();
    if(!this.timer){ this.next = ac.currentTime + .1; this.timer = setInterval(() => this.tick(), 30); }
  },
  setVol(){ if(this.gain) this.gain.gain.setTargetAtTime(settings.music && settings.sound ? .5 : 0, ac.currentTime, .3); },
  bpm(){ if(boss) return 142; if(state === 'play' || state === 'dead') return Math.min(138, 112 + score*.5); return 96; },
  tick(){
    if(!ac || ac.state !== 'running' || !this.gain) return;
    if(this.next < ac.currentTime) this.next = ac.currentTime + .05;
    while(this.next < ac.currentTime + .15){ this.play(this.step, this.next); this.next += 60 / this.bpm() / 4; this.step++; }
  },
  syn(f, t, dur, type, vol, cut, attack=.005){
    const o = ac.createOscillator(), fl = ac.createBiquadFilter(), g = ac.createGain();
    o.type = type; o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.value = cut;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(fl); fl.connect(g); g.connect(this.gain); o.start(t); o.stop(t + dur + .05);
  },
  hit(t, vol, hp, dur){
    const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = this.nb; fl.type = 'highpass'; fl.frequency.value = hp;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    s.connect(fl); fl.connect(g); g.connect(this.gain); s.start(t); s.stop(t + dur + .02);
  },
  kick(t){ const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + .12);
    g.gain.setValueAtTime(.55, t); g.gain.exponentialRampToValueAtTime(.001, t + .25); o.connect(g); g.connect(this.gain); o.start(t); o.stop(t + .3); },
  play(i, t){
    const intense = state === 'play' || state === 'dead' || state === 'replay';
    const prog = CHORDS[intense ? world : 0], s = i % 16, [root, minor] = prog[Math.floor(i/16) % 4];
    const base = semi(55, root), tones = minor ? [0,3,7,12] : [0,4,7,12], beat = 60 / this.bpm();
    if(intense ? s % 4 === 0 : s % 8 === 0) this.kick(t);
    if(intense && (s === 4 || s === 12)) this.hit(t, .16, 1500, .14);
    if(s % 2 === 1 || boss) this.hit(t, s % 4 === 3 ? .05 : .03, 7000, .04);
    if(s % 2 === 0) this.syn(base * (s % 4 === 2 ? 2 : 1), t, beat*.45, 'sawtooth', .09, 520);
    if(intense || s % 2 === 0) this.syn(semi(base*4, tones[(s + (s >> 2)) % 4]), t, beat*.3, 'square', .028, 2600);
    if(s === 0) for(const tt of tones.slice(0, 3)) this.syn(semi(base*2, tt), t, beat*3.8, 'triangle', .028, 1400, .25);
  }
};

// ---------- spawning ----------
function pipeSpacing(){ return Math.max(205, 245 - score*0.8); }
function spawnPipe(){
  const lvl = Math.min(score, 60);
  const gap = Math.max(128, 172 - lvl*0.8);
  const top = 90, bottom = H - GROUND - 90;
  let cy = top + gap/2 + Math.random()*(bottom - top - gap);
  const last = pipes[pipes.length-1];
  if(last){ const maxJump = 190; cy = Math.max(last.baseCy - maxJump, Math.min(last.baseCy + maxJump, cy)); }
  const moving = score >= 12 && Math.random() < Math.min(.5, (score-10)*.03);
  const breath = !moving && score >= 15 && Math.random() < .25;            // gap slowly opens and closes
  const crush = !moving && !breath && score >= 25 && Math.random() < .2;  // starts wide open, slams shut just before you
  const P = WORLDS[world];
  const p = {x: W + 40, w: 70, cy, baseCy:cy, gap: crush ? 330 : gap, target: gap, baseGap: gap + 14, passed:false, moving, ph:Math.random()*6,
    amp: moving? 30+Math.random()*30 : 0, breath, bph: Math.random()*6, crush, closed:false, hue: P.pipe[0] + Math.random()*P.pipe[1], near:false, glow:0};
  pipes.push(p);

  // the open space after this pillar gets one thing: a hazard, a power-up, a crystal or nothing
  const sp = pipeSpacing(), mid = p.x + p.w + (sp - p.w)/2, lo = 130, hi = H - GROUND - 90;
  const pickY = (avoid, minDist) => { let y; for(let k=0;k<12;k++){ y = lo + Math.random()*(hi-lo); if(Math.abs(y-avoid) >= minDist) break; } return y; };
  const roll = Math.random(); let acc = 0; const want = pr => (acc += pr, roll < acc);
  if(world === 2 && want(.3)){
    hazards.push({k:'fire', x: mid, y: H - GROUND + 20, vy: 0, r: 13, wait: .3 + Math.random()*.9, passed:false});
  } else if(score >= 20 && want(.17)){
    hazards.push({k:'laser', x: p.x + p.w + 28, w: sp - p.w - 56, y: pickY(cy, 70), ph: Math.random()*2.2, on:false, passed:false});
  } else if(score >= 6 && want(Math.min(.3, .12 + score*.008) + (world === 1 ? .12 : 0))){
    const by = pickY(cy, 85);
    hazards.push({k:'saw', x: mid, y: by, baseY: by, amp: 25 + Math.random()*35, ph: Math.random()*6, r: 21, rot: 0, ice: world === 1, passed:false});
  } else if(score >= 10 && want(.1)){
    const fy = pickY(cy, 90);
    for(let i=0;i<3;i++) hazards.push({k:'flock', x: W + 40 + i*26, y: fy + [0,-16,16][i], baseY: fy + [0,-16,16][i], ph: Math.random()*6, r: 9, warn: .9, passed:false});
  } else if(score >= 18 && want(.1)){
    hazards.push({k:'grav', x: p.x + p.w + 18, w: sp - p.w - 36});
  } else if(score >= 3 && Math.random() < .16){
    const kinds = ['shield','magnet','slow','shrink','double'];
    powers.push({k: kinds[Math.floor(Math.random()*kinds.length)], x: mid, y: clamp(cy + (Math.random()-.5)*100, 120, hi), t: 0});
  } else if(Math.random() < .55){
    gemsArr.push({x: mid + (Math.random()-.5)*20, y: clamp(cy + (Math.random()-.5)*120, 110, H-GROUND-60), t:Math.random()*6, taken:false});
  }
}

function startBoss(){

function bossAttack(){
  const b = boss, kind = b.n % 3; b.n++;
  const aimY = clamp(bird.y, 70, H - GROUND - 40);
  if(kind === 0 || kind === 2){ hazards.push({k:'blaser', y: aimY, t: 0}); }
  if(kind === 1 || kind === 2){
    const count = kind === 1 ? Math.min(4, 2 + bossCount - 1) : 1;
    for(let i=0;i<count;i++){
      const ty = kind === 1 ? clamp(aimY + (i - (count-1)/2) * 95, 60, H - GROUND - 30) : clamp(aimY + (Math.random() < .5 ? -110 : 110), 60, H - GROUND - 30);
      const vx = -300 - bossCount*20, time = (b.x - 40 - bird.x) / -vx;
      hazards.push({k:'bsaw', x: b.x - 40, y: b.y, vx, vy: (ty - b.y) / Math.max(.6, time), r: 16, rot: 0});
    }
  }
  b.hurt = .25; SFX.zap();
}

  const b = boss; boss = null;
  for(let i=0;i<5;i++) setTimeout(() => { burst(b.x + (Math.random()-.5)*60, b.y + (Math.random()-.5)*60, 30, ['#ff3355','#ffd23d','#fff','#8a5cff'], 420, {life:1.1, size:7, g:300, glow:true}); ring(b.x, b.y, '#ffd23d', 140 + i*30, .6, 8); }, i*120);
  SFX.bossDown(); shake(12, .6); flash(.8, '#fff'); punch(.08); vibe(150);
  popup(W/2, H*.3, tr('boss_down'), '#ffd23d', 36);
  runGems += 20; $('gemCount').textContent = runGems; setTimeout(() => popup(W/2, H*.3 + 40, '+20 ◆', '#29f0ff', 28), 300);
  hazards = hazards.filter(h => h.k !== 'blaser' && h.k !== 'bsaw');
  stats.bosses++; mEvent('boss', 1);
  nextBossAt = score + 55; distSince = 0;
  addPoints(5);
}

function hit(){
  if(!bird.alive || bird.inv > 0) return;
  if(bird.shield){
    bird.shield = false; bird.inv = 1.4; bird.vy = bird.inGrav ? 400 : -400;
    SFX.shieldBreak(); vibe(50); shake(9, .3); flash(.55, '#29f0ff'); punch(.07); fx.hitstop = .06;
    burst(bird.x, bird.y, 34, ['#29f0ff','#c8fcff','#fff'], 380, {life:.8, size:5, g:200, glow:true, shape:'s'});
    ring(bird.x, bird.y, '#29f0ff', 120, .5, 8);

  }
  die();
}

function addPoints(n){
  const before = score; score += n; scorePop = 1;
  if(Math.floor(score/10) > Math.floor(before/10)){
    popup(W/2, H*.32, (Math.floor(score/10)*10) + '!', '#ffd23d', 64);
    shake(5, .25); flash(.35, '#ffd23d'); punch(.06);
    burst(W/2, H*.32, 40, ['#ffd23d','#ff3d9a','#29f0ff','#fff'], 420, {life:1, size:6, g:300, glow:true});
    SFX.best();
  }
  const w = Math.floor(score/25) % WORLDS.length;
  if(w !== world){ world = w; worldChange(); }
  mEvent('score', 0, score); mEvent('total', n);
  if(score >= nextBossAt && !boss) bossPending = true;
  if(score > best && best > 0 && !newBestFlag){ newBestFlag = true; popup(W/2, H*.42, tr('newbest'), '#29f0ff', 36); flash(.3, '#29f0ff'); }
}

  burst(W/2, H*.3, 50, [WORLDS[world].grid, '#fff', WORLDS[world].sun[0]], 500, {life:1.2, size:6, g:200, glow:true});

function passPipe(p){
  const top = p.cy - p.gap/2, bot = p.cy + p.gap/2;
  const dist = Math.min(Math.abs(bird.y - bird.r - top), Math.abs(bot - (bird.y + bird.r)));
  const near = dist < 16;
  if(near) streak++; else streak = 0;
  const mult = comboMult();
  SFX.score(score);
  burst(p.x + p.w, bird.y, 10, ['#ffd23d','#fff','#29f0ff'], 200, {life:.5, size:4, g:0, glow:true});
  ring(bird.x, bird.y, 'rgba(255,210,61,.8)', 70, .4, 4);
  if(near){
    p.near = true; p.glow = 1;
    popup(bird.x + 30, bird.y - 30, tr('near'), '#ff3d9a', 26);
    if(mult > 1) setTimeout(() => popup(bird.x + 30, bird.y - 2, tr('combo') + ' x' + mult, '#ffd23d', 22 + mult*3), 90);
    SFX.near(); shake(4, .15); flash(.25, '#ff3d9a'); punch(.04);
    runNear++; stats.near++; mEvent('near', 0, runNear); mEvent('combo', 0, mult);
  }
  addPoints(mult);
}

function pickPower(pw){

const POWER_COL = {shield:'#29f0ff', magnet:'#ff3d9a', slow:'#b28cff', shrink:'#7dff4a', double:'#ffd23d'};

// ---------- replay recording ----------
function snapshot(){

}
function applySnap(s){ bird = s.bird; pipes = s.pipes; hazards = s.hazards; powers = s.powers; gemsArr = s.gemsArr; boss = s.boss; scroll = s.scroll; score = s.score; world = s.world; streak = s.streak; }

// ---------- update ----------
function update(dt){

    fx.shakeX = (Math.random()*2-1)*a; fx.shakeY = (Math.random()*2-1)*a; fx.shakeR = (Math.random()*2-1)*a*.002; if(fx.shake<=0) fx.shakeMax=0; }
  else { fx.shakeX = fx.shakeY = fx.shakeR = 0; }
  fx.flash = Math.max(0, fx.flash - dt*3);
  fx.chroma = Math.max(0, fx.chroma - dt*1.4);
  fx.vignette = Math.max(0, fx.vignette - dt*.8);
  fx.zoomV += (1 - fx.zoom) * 60 * dt; fx.zoomV *= Math.pow(.0001, dt); fx.zoom += fx.zoomV;
  fx.zoom = clamp(fx.zoom, .9, 1.15);

  if(fx.hitstop > 0){ fx.hitstop -= dt; dt = 0; }
  fx.timeScale += (1 - fx.timeScale) * Math.min(1, dt*1.6);
  const playing = state === 'play', ready = state === 'ready', dead = state === 'dead' || state === 'over';
  if(playing){ slowT = Math.max(0, slowT - dt); shrinkT = Math.max(0, shrinkT - dt); dblT = Math.max(0, dblT - dt); }
  slowF += ((slowT > 0 ? .6 : 1) - slowF) * Math.min(1, dt*6);
  const gdt = dt * fx.timeScale * (playing ? slowF : 1);

  const worldSpeed = (playing ? speed : (dead ? 0 : 140));
  if(state !== 'pause' && state !== 'replay') scroll += worldSpeed * gdt;

  if(state === 'menu'){
    bird.x = W*.5 + Math.sin(t*.9)*W*.18; bird.y = H*.40 + Math.sin(t*1.7)*30;
    bird.rot = Math.cos(t*1.7)*.25; bird.flapT = (Math.sin(t*14)+1)/2;
    trail(gdt);
  }
  if(ready){
    bird.x += (W*.3 - bird.x)*Math.min(1, dt*5);
    bird.y = H*.42 + Math.sin(t*4)*10; bird.rot = 0; bird.flapT = (Math.sin(t*14)+1)/2;
    trail(gdt);
  }
  if(state === 'replay'){
    repIdx += dt * 60 * .5;
    const i = Math.floor(repIdx);
    if(i >= rec.length){ endReplay(); }
    else { applySnap(rec[i]); if(repAlive && !bird.alive) deathFx(bird.x, bird.y); repAlive = bird.alive; if(bird.alive) trail(dt); }
  }
  if(playing || dead){
    // bird physics
    const gm = WORLDS[world].grav || 1;
    bird.inGrav = playing && bird.alive && hazards.some(h => h.k === 'grav' && bird.x > h.x && bird.x < h.x + h.w);
    gameTime += gdt;
    bird.vy += (bird.inGrav ? -1 : 1) * 1450 * gm * gdt; bird.vy = clamp(bird.vy, -720, 720);
    bird.y += bird.vy * gdt;
    const v = bird.inGrav ? -bird.vy : bird.vy;
    const target = clamp(v / 520, -.5, 1.4);
    bird.rot += (target - bird.rot) * Math.min(1, gdt * (v < 0 ? 14 : 5));
    bird.flapT = Math.max(0, bird.flapT - gdt*4);
    bird.flip += ((bird.inGrav ? -1 : 1) - bird.flip) * Math.min(1, gdt*12);
    bird.scale += ((shrinkT > 0 ? .6 : 1) - bird.scale) * Math.min(1, gdt*8);
    bird.r = 15 * bird.scale;
    if(!bird.alive) bird.rot += gdt * 10;

    if(playing){
      speed = Math.min(235, 165 + score*1.6);
      if(!bossPending && !boss){
        distSince += speed * gdt;
        if(distSince >= pipeSpacing()){ distSince = 0; spawnPipe(); }
      }
      if(bossPending && pipes.every(p => p.x + p.w < bird.x - 20) && hazards.every(h => h.k === 'grav' ? h.x + h.w < bird.x : h.x < bird.x - 40)) startBoss();
      trail(gdt);
      const ceil = bird.inGrav ? bird.r + 2 : bird.r - 40;
      if(bird.y < ceil){ bird.y = ceil; bird.vy = Math.max(bird.vy, 0); }
      if(bird.y + bird.r > H - GROUND){ bird.y = H - GROUND - bird.r;
        if(bird.shield || bird.inv > 0){ hit(); bird.vy = -520; shake(4,.12); burst(bird.x, bird.y+bird.r, 12, ['#29f0ff','#fff'], 200, {life:.4, size:4}); }

    }

    // boss
    if(boss){
      const b = boss; b.t += gdt; b.hurt = Math.max(0, b.hurt - gdt);

      b.eye += (clamp(bird.y, b.y - 14, b.y + 14) - b.eye) * Math.min(1, gdt*8);

    }

    // pillars
    for(const p of pipes){
      p.x -= worldSpeed * gdt;
      if(p.moving && playing){ p.ph += gdt*1.6; p.cy = p.baseCy + Math.sin(p.ph)*p.amp; }
      if(p.breath && playing && !p.passed){ p.bph += gdt*2.4; p.gap = p.baseGap + Math.sin(p.bph)*22; }
      if(p.crush && !p.closed && playing && p.x < bird.x + 240){
        p.gap += (p.target - p.gap) * Math.min(1, gdt*16);

          burst(p.x + p.w/2, p.cy - p.gap/2, 10, [col, '#fff'], 160, {life:.35, size:3, g:0}); burst(p.x + p.w/2, p.cy + p.gap/2, 10, [col, '#fff'], 160, {life:.35, size:3, g:0}); }
      }

        if(playing){ h.ph += gdt*2; h.y = h.baseY + Math.sin(h.ph)*h.amp; }
        h.rot += gdt*14;
        if(playing){
          if(touch(h.x, h.y, h.r)) hit();
          if(!h.passed && h.x + h.r < bird.x - bird.r){ h.passed = true; if(bird.alive){ stats.saws++; mEvent('saws', 1); } }
        }
      } else if(h.k === 'laser'){
        h.x -= worldSpeed * gdt;
        if(playing){ h.ph = (h.ph + gdt) % 2.2; }
        const wasOn = h.on; h.on = h.ph < .75; h.warn = h.ph > 1.7;
        if(h.on && !wasOn && h.x < W && h.x + h.w > 0) SFX.zap();
        if(playing){
          if(h.on && bird.x + bird.r*.8 > h.x && bird.x - bird.r*.8 < h.x + h.w && Math.abs(bird.y - h.y) < 5 + bird.r*.72) hit();
          if(!h.passed && h.x + h.w < bird.x - bird.r){ h.passed = true; if(bird.alive){ stats.lasers++; mEvent('lasers', 1); } }
        }
      } else if(h.k === 'fire'){
        h.x -= worldSpeed * gdt;
        if(!playing) continue;
        if(h.wait > 0){ h.wait -= gdt; if(h.wait <= 0){ h.y = H - GROUND; h.vy = -(560 + Math.random()*160); noise(.2, .08, 900); } }
        else { h.vy += 900*gdt; h.y += h.vy*gdt;
          if(settings.fx && Math.random() < .7) particle({x:h.x + (Math.random()-.5)*8, y:h.y, vx:(Math.random()-.5)*30, vy:-30 - Math.random()*40, g:-60, life:.4, max:.4, size:4, color: Math.random()<.5 ? '#ffd23d' : '#ff5a1f', drag:0, glow:true});

    if(P.embers && Math.random() < .4) particle({x: Math.random()*(W+100), y: H - GROUND, vx: -30 - Math.random()*30, vy: -50 - Math.random()*90, g: -10, life: 4, max: 4, size: 1.5 + Math.random()*2, color: Math.random()<.5 ? '#ffb13d' : '#ff5a1f', drag: 0, glow: true});

function trail(dt){

  else if(sk.fx === 'star'){ if(Math.random() < .5) particle({x, y, vx:-40, vy:(Math.random()-.5)*40, g:0, life:.6, max:.6, size:5, color: Math.random()<.5 ? '#ffe36e' : '#ff9de2', drag:0, shape:'st', rot:Math.random()*6, vr:4, glow:true, world:true}); }
  else if(sk.fx === 'pixel') particle({x: Math.round(x/4)*4, y: Math.round(y/4)*4, vx:-30, vy:0, g:0, life:.5, max:.5, size:6, color:['#3dff8a','#2a7bff','#ff3d9a','#ffd23d'][Math.floor(Math.random()*4)], drag:0, shape:'p', world:true});

function circleRect(cx_, cy_, r, rx, ry, rw, rh){
  const nx = Math.max(rx, Math.min(cx_, rx+rw)), ny = Math.max(ry, Math.min(cy_, ry+rh));
  const dx = cx_-nx, dy = cy_-ny; return dx*dx + dy*dy < r*r;

// ---------- render ----------
function render(){

    c.font = '900 64px system-ui,-apple-system,Roboto,sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.lineWidth = 10; c.strokeStyle = '#2a0b45'; c.strokeText(score, 0, 4);

    if(mult > 1){

      c.font = '900 24px system-ui,-apple-system,Roboto,sans-serif'; c.textAlign = 'left';
      c.lineWidth = 6; c.strokeText('x' + mult, tw/2 + 6, -18); c.shadowColor = '#ffd23d'; c.fillStyle = '#ffd23d'; c.fillText('x' + mult, tw/2 + 6, -18);

    if(bird.magnet > 0) act.push(['magnet', bird.magnet/7]);
    if(slowT > 0) act.push(['slow', slowT/4.5]);
    if(shrinkT > 0) act.push(['shrink', shrinkT/6]);

function drawSky(c){
  const P = WORLDS[world];
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, P.top); g.addColorStop(.55, P.mid); g.addColorStop(1, P.bot);
  c.fillStyle = g; c.fillRect(-40, -40, W+80, H+80);

  for(const s of stars){ const a = (.4 + .6*Math.abs(Math.sin(t*s.s*2 + s.t))) * sf; c.globalAlpha = a; c.fillStyle = '#fff';
    const x = ((s.x - scroll*.03*s.s) % W + W) % W, r = P.planet ? s.r*1.3 : s.r; c.fillRect(x, s.y, r, r); }
  c.globalAlpha = 1;
  const sx = W*.72, sy = H*.52;
  if(P.planet){
    const pg = c.createRadialGradient(sx - 30, sy - 30, 10, sx, sy, 95); pg.addColorStop(0, P.sun[1]); pg.addColorStop(.6, P.sun[0]); pg.addColorStop(1, '#2a0b45');
    c.save(); c.shadowColor = P.glow; c.shadowBlur = 50; c.fillStyle = pg; c.beginPath(); c.arc(sx, sy, 85, 0, Math.PI*2); c.fill(); c.restore();
    c.save(); c.translate(sx, sy); c.rotate(-.35); c.strokeStyle = 'rgba(200,180,255,.7)'; c.lineWidth = 6; c.beginPath(); c.ellipse(0, 0, 140, 24, 0, Math.PI*1.04, Math.PI*1.96, true); c.stroke(); c.restore();
  } else {
    const sg = c.createLinearGradient(0, sy-90, 0, sy+90); sg.addColorStop(0, P.sun[0]); sg.addColorStop(1, P.sun[1]);
    c.save(); c.shadowColor = P.glow; c.shadowBlur = 60; c.fillStyle = sg; c.beginPath(); c.arc(sx, sy, 90, 0, Math.PI*2); c.fill(); c.restore();
    c.fillStyle = P.mid;
    for(let i=0;i<7;i++){ const yy = sy + 10 + i*12 + ((t*8)%12); c.fillRect(sx-100, yy, 200, 2 + i*.9); }
  }
  if(!P.planet) for(const cl of clouds){ const x = ((cl.x - scroll*.08*cl.s) % (W+200) + W+200) % (W+200) - 100; c.globalAlpha = cl.a * (P.embers ? .6 : 1); c.fillStyle = P.embers ? '#ffb08a' : '#fff';
    c.beginPath(); c.ellipse(x, cl.y, 70*cl.s, 14*cl.s, 0, 0, Math.PI*2); c.fill(); c.beginPath(); c.ellipse(x+30*cl.s, cl.y-8*cl.s, 40*cl.s, 12*cl.s, 0, 0, Math.PI*2); c.fill(); }
  c.globalAlpha = 1;
  mountainLayer(c, mountains[0], .12, H - GROUND - 20, P.m1, P.snow);
  if(P.city){
    const cityW = buildings.length ? buildings[buildings.length-1].x + 60 : W;
    for(const b of buildings){ const x = ((b.x - scroll*.3) % cityW + cityW) % cityW - 50, y = H - GROUND - b.h;
      c.fillStyle = P.city; c.fillRect(x, y, b.w, b.h);
      c.fillStyle = P.win;
      for(let wy=y+8; wy<H-GROUND-8; wy+=12) for(let wx=x+5; wx<x+b.w-6; wx+=9) if(((wx*7+wy*13+b.win*100)|0)%5===0) c.fillRect(wx, wy, 4, 5); }
  }
  mountainLayer(c, mountains[1], .45, H - GROUND + 6, P.m2);
}
function mountainLayer(c, pts, par, base, color, caps){
  if(!pts.length) return; const span = pts[pts.length-1].x; const off = (scroll*par) % span;
  c.fillStyle = color; c.beginPath(); c.moveTo(-10, H);
  for(let k=0;k<2;k++) for(const p of pts){ c.lineTo(p.x - off + k*span, base - p.h); }
  c.lineTo(W+10, H); c.closePath(); c.fill();
  if(caps){ c.fillStyle = 'rgba(240,250,255,.75)';
    for(let k=0;k<2;k++) for(const p of pts){ const x = p.x - off + k*span, y = base - p.h; if(x < -40 || x > W+40) continue;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x - 16, y + 14); c.lineTo(x + 16, y + 14); c.closePath(); c.fill(); } }
}

function drawWorld(c){
  for(const h of hazards) if(h.k === 'grav') drawGrav(c, h);
  for(const p of pipes) drawPipe(c, p);
  for(const h of hazards){
    if(h.k === 'saw' || h.k === 'bsaw') drawSaw(c, h);
    else if(h.k === 'laser') drawLaser(c, h);
    else if(h.k === 'fire') drawFire(c, h);
    else if(h.k === 'flock') drawFlock(c, h);
  }
  if(boss) drawBoss(c, boss);
  for(const h of hazards) if(h.k === 'blaser') drawBossLaser(c, h);
  for(const pw of powers) drawPower(c, pw);
  for(const g of gemsArr){ if(g.taken) continue; const bob = Math.sin(g.t*4)*5, sc = 1 + Math.sin(g.t*8)*.06;
    c.save(); c.translate(g.x, g.y + bob); c.scale(Math.cos(g.t*3)*sc, sc);
    c.shadowColor = '#29f0ff'; c.shadowBlur = 22; c.fillStyle = dblT > 0 ? '#ffd23d' : '#29f0ff';
    c.beginPath(); c.moveTo(0,-14); c.lineTo(11,0); c.lineTo(0,14); c.lineTo(-11,0); c.closePath(); c.fill();
    c.shadowBlur = 0; c.fillStyle = '#fff8e0'; c.beginPath(); c.moveTo(0,-14); c.lineTo(5,-2); c.lineTo(0,2); c.lineTo(-5,-2); c.closePath(); c.fill();
    c.restore(); }
  // ground
  const P = WORLDS[world], gy = H - GROUND;
  const gg = c.createLinearGradient(0, gy, 0, H); gg.addColorStop(0, P.ground[0]); gg.addColorStop(1, P.ground[1]);
  c.fillStyle = gg; c.fillRect(-40, gy, W+80, GROUND+40);
  c.save(); c.globalAlpha = .8; c.strokeStyle = P.grid; c.lineWidth = 1.5; c.shadowColor = P.grid; c.shadowBlur = 8;
  const off = scroll % 40;
  for(let x=-40-off; x<W+80; x+=40){ c.beginPath(); c.moveTo(W/2 + (x - W/2)*.35, gy); c.lineTo(W/2 + (x - W/2)*2.2, H+20); c.stroke(); }
  for(let i=0;i<5;i++){ const yy = gy + Math.pow((i + ((scroll*.02)%1))/5, 2)*GROUND; c.beginPath(); c.moveTo(-40, yy); c.lineTo(W+40, yy); c.stroke(); }
  c.globalAlpha = 1; c.lineWidth = 3; c.shadowBlur = 18; c.beginPath(); c.moveTo(-40, gy); c.lineTo(W+40, gy); c.stroke();
  c.restore();
  // fireball launch warnings
  for(const h of hazards) if(h.k === 'fire' && h.wait > 0 && h.wait < .5){ c.save(); c.globalAlpha = .5 + .5*Math.sin(t*30); c.fillStyle = '#ffb13d'; c.shadowColor = '#ff5a1f'; c.shadowBlur = 20;
    c.beginPath(); c.ellipse(h.x, gy + 2, 16, 5, 0, 0, Math.PI*2); c.fill(); c.restore(); }

  for(const r of rings){ c.globalAlpha = Math.max(0, r.life/r.max); c.strokeStyle = r.color; c.lineWidth = r.width * (r.life/r.max) + .5;
    c.beginPath(); c.arc(r.x, r.y, r.r, 0, Math.PI*2); c.stroke(); }
  c.globalAlpha = 1;
  for(const p of parts){
    const a = Math.max(0, p.life/p.max); c.globalAlpha = Math.min(1, a * (p.life > p.max - .3 && p.max > 3 ? 1 : 1)); c.fillStyle = p.color; c.strokeStyle = p.color;
    const s = p.size * (p.max > 3 ? 1 : (.4 + .6*a));
    if(p.glow && settings.fx) c.globalCompositeOperation = 'lighter';
    if(p.shape === 'c'){ c.beginPath(); c.arc(p.x, p.y, s, 0, Math.PI*2); c.fill(); }
    else if(p.shape === 'p'){ c.fillRect(p.x - s/2, p.y - s/2, s, s); }
    else { c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
      if(p.shape === 'f'){ c.beginPath(); c.ellipse(0,0,s*1.6,s*.6,0,0,Math.PI*2); c.fill(); }
      else if(p.shape === 'st'){ starPath(c, s*1.3, s*.55); c.fill(); }
      else if(p.shape === '*'){ c.lineWidth = 1.4; c.beginPath(); for(let k=0;k<3;k++){ const an = k*Math.PI/3; c.moveTo(Math.cos(an)*s, Math.sin(an)*s); c.lineTo(-Math.cos(an)*s, -Math.sin(an)*s); } c.stroke(); }
      else c.fillRect(-s/2,-s/2,s,s);
      c.restore(); }
    c.globalCompositeOperation = 'source-over';
  }
  c.globalAlpha = 1;
  // bird
  const blinkOff = bird.inv > 0 && Math.floor(t*18) % 2 === 0;
  if((state !== 'over' || bird.y < H) && !blinkOff){
    c.save(); c.translate(bird.x, bird.y); c.scale(bird.scale, bird.scale);
    drawBird(c, 0, 0, bird.rot, bird.flapT, SKINS[skinIdx], bird.squash, !bird.alive, hatIdx, bird.flip);
    c.restore();
  }
  if(bird.alive && bird.shield){
    const wob = 1 + Math.sin(t*9)*.05;
    c.save(); c.translate(bird.x, bird.y); c.scale(wob*bird.scale, (2 - wob)*bird.scale);
    c.fillStyle = 'rgba(41,240,255,.13)'; c.strokeStyle = 'rgba(160,250,255,.9)'; c.lineWidth = 2.5; c.shadowColor = '#29f0ff'; c.shadowBlur = 16;
    c.beginPath(); c.arc(0, 0, 28, 0, Math.PI*2); c.fill(); c.stroke();
    c.shadowBlur = 0; c.strokeStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.arc(0, 0, 22, -2.4, -1.6); c.stroke(); c.restore();
  }
  if(bird.alive && bird.magnet > 0){
    const a = Math.min(1, bird.magnet);
    c.save(); c.translate(bird.x, bird.y); c.rotate(t*3); c.globalAlpha = .75*a; c.strokeStyle = '#ff3d9a'; c.lineWidth = 3; c.shadowColor = '#ff3d9a'; c.shadowBlur = 12;
    c.setLineDash([8, 10]); c.beginPath(); c.arc(0, 0, 34, 0, Math.PI*2); c.stroke(); c.restore();
  }
  for(const p of popups){ const a = Math.min(1, p.life*2.5), s = 1 + (1-Math.min(1,(p.max-p.life)*6))*.6;
    c.save(); c.globalAlpha = a; c.translate(p.x, p.y); c.scale(s, s);
    c.font = `900 ${p.size}px system-ui,-apple-system,Roboto,sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.lineWidth = p.size*.18; c.strokeStyle = '#1a0530'; c.strokeText(p.text, 0, 0);
    c.shadowColor = p.color; c.shadowBlur = 16; c.fillStyle = p.color; c.fillText(p.text, 0, 0); c.restore(); }
}
function starPath(c, R, r){ c.beginPath(); for(let i=0;i<10;i++){ const a = -Math.PI/2 + i*Math.PI/5, rr = i%2 ? r : R; c.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); } c.closePath(); }

function drawPipe(c, p){
  const top = p.cy - p.gap/2, bot = p.cy + p.gap/2, gy = H - GROUND;
  const col = p.near ? '#ff3d9a' : `hsl(${p.hue},100%,62%)`;
  const dark = `hsl(${p.hue},70%,14%)`;
  c.save();
  for(const [y0, y1, capY] of [[-60, top, top-26], [bot, gy, bot]]){
    const g = c.createLinearGradient(p.x, 0, p.x + p.w, 0);
    g.addColorStop(0, dark); g.addColorStop(.45, `hsl(${p.hue},60%,24%)`); g.addColorStop(1, dark);
    c.fillStyle = g; c.fillRect(p.x + 6, y0, p.w - 12, y1 - y0);
    c.shadowColor = col; c.shadowBlur = 14 + p.glow*30; c.strokeStyle = col; c.lineWidth = 2.5;
    c.strokeRect(p.x + 6, y0, p.w - 12, y1 - y0);
    c.shadowBlur = 0; c.globalAlpha = .25; c.fillStyle = col;
    for(let yy = y0; yy < y1; yy += 28) c.fillRect(p.x + 12, yy, p.w - 24, 3);
    c.globalAlpha = 1;
    c.shadowColor = col; c.shadowBlur = 20 + p.glow*40; c.fillStyle = dark; c.fillRect(p.x, capY, p.w, 26);
    c.strokeStyle = col; c.lineWidth = 3; c.strokeRect(p.x, capY, p.w, 26);
    c.shadowBlur = 0; c.fillStyle = col; c.globalAlpha = .9; c.fillRect(p.x + 4, capY + (capY===top-26? 20 : 3), p.w - 8, 3); c.globalAlpha = 1;
  }
  if(p.breath){ c.fillStyle = col; c.globalAlpha = .55 + .45*Math.sin(p.bph*2);
    for(const [yy, dir] of [[top - 34, -1], [bot + 34, 1]]){ c.beginPath(); c.moveTo(p.x + p.w/2 - 9, yy); c.lineTo(p.x + p.w/2 + 9, yy); c.lineTo(p.x + p.w/2, yy + dir*9); c.closePath(); c.fill(); }
    c.globalAlpha = 1; }
  if(p.crush && !p.closed){ c.fillStyle = '#ff3355'; c.globalAlpha = .6 + .4*Math.sin(t*16);
    for(const [yy, dir] of [[top - 40, 1], [bot + 40, -1]]) for(let k=0;k<2;k++){ const y2 = yy + k*10*dir;
      c.beginPath(); c.moveTo(p.x + p.w/2 - 10, y2); c.lineTo(p.x + p.w/2 + 10, y2); c.lineTo(p.x + p.w/2, y2 + dir*9); c.closePath(); c.fill(); }
    c.globalAlpha = 1; }
  if(p.moving){ c.fillStyle = col; c.globalAlpha = .6 + .4*Math.sin(t*8);
    c.beginPath(); c.arc(p.x + p.w/2, top - 13, 4, 0, Math.PI*2); c.arc(p.x + p.w/2, bot + 13, 4, 0, Math.PI*2); c.fill(); c.globalAlpha = 1; }
  c.restore();
}

function drawSaw(c, h){
  c.save();
  if(h.k === 'saw'){
    c.strokeStyle = h.ice ? 'rgba(160,230,255,.3)' : 'rgba(255,80,80,.25)'; c.lineWidth = 2; c.setLineDash([4, 6]);
    c.beginPath(); c.moveTo(h.x, h.baseY - h.amp - 10); c.lineTo(h.x, h.baseY + h.amp + 10); c.stroke(); c.setLineDash([]);
  }
  const accent = h.ice ? '#5ec8ff' : '#ff3355';
  c.translate(h.x, h.y); c.rotate(h.rot);
  c.shadowColor = accent; c.shadowBlur = 20;
  c.fillStyle = h.ice ? '#e6f8ff' : '#c9d2e6'; c.beginPath();
  const teeth = h.k === 'bsaw' ? 9 : 12;
  for(let i=0;i<teeth*2;i++){ const a = i/(teeth*2)*Math.PI*2, rr = i%2 ? h.r - 6 : h.r + 3; c.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
  c.closePath(); c.fill();
  c.shadowBlur = 0; c.fillStyle = h.ice ? '#8fd3f5' : '#7d86a3'; c.beginPath(); c.arc(0, 0, h.r - 8, 0, Math.PI*2); c.fill();
  c.strokeStyle = accent; c.lineWidth = 2.5; c.beginPath(); c.arc(0, 0, Math.max(2, h.r - 11), 0, Math.PI*2); c.stroke();
  c.fillStyle = '#2a0b45'; c.beginPath(); c.arc(0, 0, 4, 0, Math.PI*2); c.fill();
  c.restore();
}
function drawLaser(c, h){
  const x0 = h.x, x1 = h.x + h.w, y = h.y;
  c.save();
  for(const ex of [x0, x1]){
    c.fillStyle = '#2a0b45'; c.strokeStyle = h.on ? '#ff3355' : h.warn ? '#ffd23d' : '#6c5a8c'; c.lineWidth = 2.5;
    c.shadowColor = c.strokeStyle; c.shadowBlur = h.on || h.warn ? 16 : 0;
    c.beginPath(); c.roundRect ? c.roundRect(ex - 9, y - 13, 18, 26, 5) : c.rect(ex - 9, y - 13, 18, 26); c.fill(); c.stroke();
  }
  if(h.on){
    c.globalCompositeOperation = 'lighter'; c.shadowColor = '#ff3355'; c.shadowBlur = 24;
    c.strokeStyle = 'rgba(255,40,80,.9)'; c.lineWidth = 9 + Math.random()*2; c.beginPath(); c.moveTo(x0 + 9, y); c.lineTo(x1 - 9, y); c.stroke();
    c.strokeStyle = '#fff'; c.lineWidth = 3; c.beginPath(); c.moveTo(x0 + 9, y); c.lineTo(x1 - 9, y); c.stroke();
    c.globalCompositeOperation = 'source-over';
    if(settings.fx && Math.random() < .5) particle({x: x0 + 9 + Math.random()*(h.w - 18), y, vx:(Math.random()-.5)*80, vy:(Math.random()-.5)*120, g:0, life:.25, max:.25, size:2.5, color:'#ff6b8a', drag:0, glow:true});
  } else if(h.warn){
    c.globalAlpha = .5 + .5*Math.sin(t*40); c.strokeStyle = '#ffd23d'; c.lineWidth = 2; c.setLineDash([6, 6]); c.lineDashOffset = -t*80;
    c.beginPath(); c.moveTo(x0 + 9, y); c.lineTo(x1 - 9, y); c.stroke();
  } else {
    c.globalAlpha = .35; c.strokeStyle = '#ff6b8a'; c.lineWidth = 1; c.setLineDash([2, 8]);
    c.beginPath(); c.moveTo(x0 + 9, y); c.lineTo(x1 - 9, y); c.stroke();
  }
  c.restore();
}
function drawFire(c, h){
  if(h.wait > 0) return;
  c.save(); c.translate(h.x, h.y); c.globalCompositeOperation = 'lighter';
  const g = c.createRadialGradient(0, 0, 2, 0, 0, h.r + 8); g.addColorStop(0, '#fff6c0'); g.addColorStop(.4, '#ffb13d'); g.addColorStop(1, 'rgba(255,60,20,0)');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, h.r + 8, 0, Math.PI*2); c.fill();
  c.restore();
}
function drawFlock(c, h){
  if(h.warn > 0){
    if(state !== 'play') return;
    c.save(); c.globalAlpha = .55 + .45*Math.sin(t*25); c.fillStyle = '#ff3355'; c.shadowColor = '#ff3355'; c.shadowBlur = 14;
    c.font = '900 26px system-ui,sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('!', W - 18, h.baseY);
    c.restore(); return;
  }
  c.save(); c.translate(h.x, h.y); c.scale(-1, 1);
  const w = Math.sin(h.ph*2) * 7;
  c.fillStyle = '#1a0b2e'; c.strokeStyle = '#ff3355'; c.lineWidth = 1.5; c.shadowColor = '#ff3355'; c.shadowBlur = 10;
  c.beginPath(); c.ellipse(0, 0, 10, 7, 0, 0, Math.PI*2); c.fill(); c.stroke(); c.shadowBlur = 0;
  c.beginPath(); c.moveTo(-3, -2); c.lineTo(-12, -6 - w); c.lineTo(4, -3); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#ff3355'; c.beginPath(); c.arc(5, -2, 2, 0, Math.PI*2); c.fill();
  c.fillStyle = '#ffb13d'; c.beginPath(); c.moveTo(9, 0); c.lineTo(15, 1); c.lineTo(9, 3); c.closePath(); c.fill();
  c.restore();
}
function drawGrav(c, h){
  c.save();
  const g = c.createLinearGradient(h.x, 0, h.x + h.w, 0);
  g.addColorStop(0, 'rgba(138,92,255,0)'); g.addColorStop(.15, 'rgba(138,92,255,.22)'); g.addColorStop(.85, 'rgba(138,92,255,.22)'); g.addColorStop(1, 'rgba(138,92,255,0)');
  c.fillStyle = g; c.fillRect(h.x, 0, h.w, H - GROUND);
  c.strokeStyle = 'rgba(190,160,255,.55)'; c.lineWidth = 3;
  const off = (t*120) % 60;
  for(let y = H - GROUND - off; y > -20; y -= 60) for(let x = h.x + 22; x < h.x + h.w - 10; x += 40){
    c.beginPath(); c.moveTo(x - 9, y + 6); c.lineTo(x, y - 3); c.lineTo(x + 9, y + 6); c.stroke(); }
  c.restore();
}
function drawBoss(c, b){
  c.save(); c.translate(b.x, b.y);
  const hurt = b.hurt > 0;
  // thrusters
  c.globalCompositeOperation = 'lighter';
  for(const ty of [-30, 30]){ const fl = 18 + Math.random()*10; const g = c.createLinearGradient(40, 0, 40 + fl, 0); g.addColorStop(0, '#ffd23d'); g.addColorStop(1, 'rgba(255,60,80,0)');
    c.fillStyle = g; c.beginPath(); c.moveTo(38, ty - 7); c.lineTo(40 + fl, ty); c.lineTo(38, ty + 7); c.closePath(); c.fill(); }
  c.globalCompositeOperation = 'source-over';
  // body
  c.shadowColor = '#ff3355'; c.shadowBlur = 30;
  c.fillStyle = '#1d0b33'; c.strokeStyle = hurt ? '#fff' : '#ff3355'; c.lineWidth = 4;
  c.beginPath(); c.roundRect ? c.roundRect(-46, -52, 90, 104, 26) : c.rect(-46, -52, 90, 104); c.fill(); c.stroke();
  c.shadowBlur = 0;
  // plates
  c.strokeStyle = 'rgba(255,51,85,.4)'; c.lineWidth = 2; c.beginPath(); c.moveTo(-46, 22); c.lineTo(44, 22); c.moveTo(-20, 22); c.lineTo(-20, 52); c.moveTo(16, 22); c.lineTo(16, 52); c.stroke();
  // antenna
  c.strokeStyle = '#ff3355'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, -52); c.lineTo(0, -70); c.stroke();
  c.fillStyle = Math.sin(t*12) > 0 ? '#ff3355' : '#ffd23d'; c.beginPath(); c.arc(0, -74, 6, 0, Math.PI*2); c.fill();
  // eye
  const ey = b.eye - b.y;
  c.fillStyle = '#0b0620'; c.beginPath(); c.ellipse(-8, -12, 28, 20, 0, 0, Math.PI*2); c.fill();
  c.shadowColor = '#ff3355'; c.shadowBlur = 20; c.fillStyle = hurt ? '#fff' : '#ff3355';
  c.beginPath(); c.arc(-16, -12 + ey*.4, 10, 0, Math.PI*2); c.fill();
  c.fillStyle = '#fff'; c.shadowBlur = 0; c.beginPath(); c.arc(-19, -15 + ey*.4, 3, 0, Math.PI*2); c.fill();
  // brows
  c.strokeStyle = '#ff3355'; c.lineWidth = 4; c.beginPath(); c.moveTo(-36, -38); c.lineTo(10, -30); c.stroke();
  c.restore();
}
function drawBossLaser(c, h){
  c.save();
  if(h.t < .9){
    c.globalAlpha = .45 + .45*Math.sin(t*36); c.strokeStyle = '#ff3355'; c.lineWidth = 2; c.setLineDash([10, 8]); c.lineDashOffset = t*120;
    c.beginPath(); c.moveTo(0, h.y); c.lineTo(W, h.y); c.stroke();
    c.setLineDash([]); c.globalAlpha = 1; c.fillStyle = '#ff3355'; c.font = '900 22px system-ui,sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('⚠', 22, h.y - 18);
  } else if(h.t < 1.45){
    const k = 1 - Math.abs((h.t - 1.17) / .28);
    c.globalCompositeOperation = 'lighter'; c.shadowColor = '#ff3355'; c.shadowBlur = 30;
    c.strokeStyle = 'rgba(255,40,80,.9)'; c.lineWidth = 14*k + 6; c.beginPath(); c.moveTo(-10, h.y); c.lineTo(W + 10, h.y); c.stroke();
    c.strokeStyle = '#fff'; c.lineWidth = 4*k + 2; c.beginPath(); c.moveTo(-10, h.y); c.lineTo(W + 10, h.y); c.stroke();
  }
  c.restore();
}

function drawPowerIcon(c, k, col){
  if(k === 'shield'){
    c.fillStyle = col; c.beginPath(); c.moveTo(0, -11); c.lineTo(9, -7); c.quadraticCurveTo(9, 6, 0, 12); c.quadraticCurveTo(-9, 6, -9, -7); c.closePath(); c.fill();
    c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.moveTo(0, -8); c.lineTo(0, 8); c.quadraticCurveTo(-6, 4, -6, -5); c.closePath(); c.fill();
  } else if(k === 'magnet'){
    c.lineCap = 'butt'; c.lineWidth = 6; c.strokeStyle = col;
    c.beginPath(); c.moveTo(-7, -4); c.lineTo(-7, 1); c.arc(0, 1, 7, Math.PI, 0, true); c.lineTo(7, -4); c.stroke();
    c.strokeStyle = '#fff'; c.beginPath(); c.moveTo(-7, -4); c.lineTo(-7, -10); c.moveTo(7, -4); c.lineTo(7, -10); c.stroke();
  } else if(k === 'slow'){
    c.strokeStyle = col; c.lineWidth = 3; c.beginPath(); c.arc(0, 1, 10, 0, Math.PI*2); c.stroke();
    c.fillStyle = col; c.fillRect(-3, -14, 6, 4);
    c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.lineCap = 'round'; c.beginPath(); c.moveTo(0, 1); c.lineTo(0, -5); c.moveTo(0, 1); c.lineTo(5, 4); c.stroke();
  } else if(k === 'shrink'){
    c.strokeStyle = col; c.lineWidth = 3; c.lineCap = 'round';
    for(const [sx, sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){ c.beginPath(); c.moveTo(sx*11, sy*11); c.lineTo(sx*4, sy*4); c.moveTo(sx*4, sy*4); c.lineTo(sx*4, sy*9); c.moveTo(sx*4, sy*4); c.lineTo(sx*9, sy*4); c.stroke(); }
    c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, 2.5, 0, Math.PI*2); c.fill();
  } else {
    c.fillStyle = col; c.font = '900 16px system-ui,sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('x2', 0, 1);
  }
}
function drawPower(c, pw){
  const col = POWER_COL[pw.k], bob = Math.sin(pw.t*4)*6, pul = 1 + Math.sin(pw.t*7)*.08;
  c.save(); c.translate(pw.x, pw.y + bob); c.scale(pul, pul);
  c.shadowColor = col; c.shadowBlur = 26; c.fillStyle = 'rgba(20,8,48,.85)'; c.strokeStyle = col; c.lineWidth = 3;
  c.beginPath(); c.arc(0, 0, 19, 0, Math.PI*2); c.fill(); c.stroke(); c.shadowBlur = 0;
  c.rotate(Math.sin(pw.t*3)*.2);
  drawPowerIcon(c, pw.k, col);
  c.restore();
}

function drawBird(c, x, y, rot, flapT, sk, squash, dead, hat=0, flipY=1){
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(1, flipY);
  const sx = 1 + squash*.18, sy = 1 - squash*.14; c.scale(sx, sy);
  const body = sk.rainbow ? `hsl(${(t*200)%360},100%,60%)` : sk.body;
  c.shadowColor = body; c.shadowBlur = 24;
  c.fillStyle = sk.wing; c.beginPath(); c.moveTo(-14, -2); c.lineTo(-27, -9); c.lineTo(-24, 1); c.lineTo(-28, 8); c.lineTo(-13, 5); c.closePath(); c.fill();
  c.fillStyle = body; c.beginPath(); c.ellipse(0, 0, 18, 15, 0, 0, Math.PI*2); c.fill();
  c.shadowBlur = 0;
  c.fillStyle = sk.belly; c.beginPath(); c.ellipse(2, 6, 11, 7, 0, 0, Math.PI*2); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.ellipse(8, -5, 7, 7.5, 0, 0, Math.PI*2); c.fill();
  if(dead){ c.strokeStyle = '#1a0530'; c.lineWidth = 2.2; c.beginPath(); c.moveTo(5,-8); c.lineTo(11,-2); c.moveTo(11,-8); c.lineTo(5,-2); c.stroke(); }
  else if(bird && bird.blink > 0){ c.strokeStyle = '#1a0530'; c.lineWidth = 2.2; c.beginPath(); c.moveTo(4,-5); c.lineTo(12,-5); c.stroke(); }
  else { c.fillStyle = '#1a0530'; c.beginPath(); c.arc(10, -5, 3.4, 0, Math.PI*2); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(11, -6.5, 1.2, 0, Math.PI*2); c.fill(); }
  c.fillStyle = 'rgba(255,90,140,.55)'; c.beginPath(); c.ellipse(5, 4, 3.5, 2.2, 0, 0, Math.PI*2); c.fill();
  c.fillStyle = '#ff7a2f'; c.beginPath(); c.moveTo(14, 0); c.quadraticCurveTo(26, 2, 15, 7); c.closePath(); c.fill();
  c.fillStyle = '#ffb36b'; c.beginPath(); c.moveTo(14, 0); c.quadraticCurveTo(24, 1, 15, 3.5); c.closePath(); c.fill();
  if(hat) drawHat(c, hat);
  const wa = -0.9 + flapT*1.6;
  c.save(); c.translate(-4, 2); c.rotate(wa);
  c.fillStyle = sk.wing; c.beginPath(); c.ellipse(-2, 0, 11, 6.5, 0, 0, Math.PI*2); c.fill();
  c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(-4, -2, 6, 2, 0, 0, Math.PI*2); c.fill();
  c.restore();
  c.restore();
}
function drawHat(c, id){
  c.save();
  if(id === 1){        // cap
    c.fillStyle = '#ff3d5a'; c.beginPath(); c.ellipse(1, -12, 12, 8, 0, Math.PI, 0); c.closePath(); c.fill();
    c.beginPath(); c.ellipse(13, -12.5, 9, 2.6, 0, 0, Math.PI*2); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(1, -19.5, 2, 0, Math.PI*2); c.fill();
    c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(-6, -15, 6, 2);
  } else if(id === 2){ // shades
    c.fillStyle = '#111'; c.beginPath(); c.roundRect ? c.roundRect(2, -10, 15, 8, 3) : c.rect(2, -10, 15, 8); c.fill();
    c.fillRect(-8, -8, 11, 2.2);
    c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(5, -8); c.lineTo(9, -8); c.stroke();
  } else if(id === 3){ // crown
    c.fillStyle = '#ffd23d'; c.shadowColor = '#ffd23d'; c.shadowBlur = 10;
    c.beginPath(); c.moveTo(-8, -12); c.lineTo(-9, -22); c.lineTo(-4, -16); c.lineTo(1, -25); c.lineTo(5, -16); c.lineTo(10, -22); c.lineTo(9, -12); c.closePath(); c.fill();
    c.shadowBlur = 0; c.fillStyle = '#ff3d9a'; c.beginPath(); c.arc(1, -15, 2, 0, Math.PI*2); c.fill();
    c.fillStyle = '#29f0ff'; c.beginPath(); c.arc(-5, -14, 1.5, 0, Math.PI*2); c.arc(7, -14, 1.5, 0, Math.PI*2); c.fill();
  } else if(id === 4){ // headphones
    c.strokeStyle = '#2a2a3a'; c.lineWidth = 3.5; c.beginPath(); c.arc(-1, -4, 15, Math.PI*1.12, Math.PI*1.9); c.stroke();
    c.fillStyle = '#ff3d9a'; c.strokeStyle = '#2a2a3a'; c.lineWidth = 2; c.beginPath(); c.ellipse(-5, -3, 5, 7, 0, 0, Math.PI*2); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(-5, -4, 1.5, 0, Math.PI*2); c.fill();
  } else if(id === 5){ // wizard
    c.fillStyle = '#5a2fd6'; c.beginPath(); c.moveTo(-11, -11); c.quadraticCurveTo(-2, -24, 4, -40); c.quadraticCurveTo(8, -24, 14, -11); c.closePath(); c.fill();
    c.fillStyle = '#ffd23d'; c.fillRect(-11, -14, 25, 3.5);
    c.save(); c.translate(3, -26); starPath(c, 3.5, 1.5); c.fill(); c.restore();
    c.fillStyle = '#ff9de2'; c.beginPath(); c.arc(4, -40, 2.2, 0, Math.PI*2); c.fill();
  } else if(id === 6){ // halo
    c.strokeStyle = '#ffe36e'; c.lineWidth = 3; c.shadowColor = '#ffe36e'; c.shadowBlur = 14;
    c.beginPath(); c.ellipse(2, -26 + Math.sin(t*3)*1.5, 11, 3.5, 0, 0, Math.PI*2); c.stroke();
  }
  c.restore();
}

// ---------- missions ----------
// run: progress is the best value reached in a single run; otherwise progress accumulates across runs
const MTYPES = {
  score:  {run:true,  n:l => 10 + l*10},
  gems:   {run:true,  n:l => 3 + l*2},
  near:   {run:true,  n:l => 2 + l},
  combo:  {run:true,  n:l => Math.min(5, 2 + l)},
  games:  {run:false, n:l => 3 + l*3},
  total:  {run:false, n:l => 50 + l*75},
  saws:   {run:false, n:l => 5 + l*5},
  lasers: {run:false, n:l => 3 + l*4},
  power:  {run:false, n:l => 2 + l*2},
  shield: {run:false, n:l => 1 + l},
  boss:   {run:false, n:l => 1 + l},
};
let mLevels = store.get('mlevels', {}), mDone = store.get('mdone', 0), mNew = store.get('mnew', 0);
let missions = store.get('missions', null);
function newMission(exclude){
  const types = Object.keys(MTYPES).filter(k => !exclude.includes(k));
  const type = types[Math.floor(Math.random()*types.length)], lvl = mLevels[type] || 0;
  return {type, n: MTYPES[type].n(lvl), reward: 10 + lvl*8 + (MTYPES[type].run ? 5 : 0) + (type === 'boss' ? 20 : 0), prog: 0};
}
if(!Array.isArray(missions) || missions.length !== 3 || missions.some(m => !MTYPES[m.type])){
  missions = [];
  for(const type of ['score','gems','games']){ missions.push({type, n: MTYPES[type].n(0), reward: 10 + (MTYPES[type].run ? 5 : 0), prog: 0}); }
  store.set('missions', missions);
}
function mText(m){ return tr('m_' + m.type).replace('{n}', m.n); }
function mEvent(type, add, runValue){
  let changed = false;
  missions.forEach((m, i) => {
    if(m.type !== type) return;
    if(MTYPES[type].run) m.prog = Math.max(m.prog, runValue); else m.prog += add;
    changed = true;
    if(m.prog >= m.n){
      gems += m.reward; stats.crystals += m.reward; mDone++; mNew++; mLevels[type] = (mLevels[type] || 0) + 1;
      store.set('gems', gems); store.set('mdone', mDone); store.set('mnew', mNew); store.set('mlevels', mLevels);
      missions[i] = newMission(missions.map(x => x.type));
      SFX.mission(); vibe(40); flash(.35, '#ffd23d');
      popup(W/2, H*.22, tr('mission_done'), '#ffd23d', 28);
      setTimeout(() => popup(W/2, H*.22 + 34, '+' + m.reward + ' ◆', '#29f0ff', 26), 250);
      burst(W/2, H*.22, 30, ['#ffd23d','#29f0ff','#ff3d9a','#fff'], 360, {life:.9, size:5, g:250, glow:true});
    }
  });
  if(changed) store.set('missions', missions);
}
function buildMissions(){
  const list = $('mList'); list.innerHTML = '';
  missions.forEach(m => {
    const d = document.createElement('div'); d.className = 'mcard';
    const pr = Math.min(m.prog, m.n);
    d.innerHTML = '<div class="d"><span></span><span class="rw">◆ ' + m.reward + '</span></div><div class="bar"><i style="width:' + (pr/m.n*100) + '%"></i></div><div class="pg">' + pr + ' / ' + m.n + '</div>';
    d.querySelector('.d span').textContent = mText(m);
    list.appendChild(d);
  });
  $('mDone').textContent = mDone;
}

// ---------- daily reward ----------
const DAILY = [10, 15, 20, 30, 40, 60, 100];
const dayKey = d => d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
function dailyInfo(){
  const last = store.get('dailyLast', ''), streakD = store.get('dailyStreak', 0);
  const now = new Date(), y = new Date(); y.setDate(y.getDate() - 1);
  const can = last !== dayKey(now);
  return {can, day: can ? (last === dayKey(y) ? (streakD % 7) + 1 : 1) : streakD};
}
function buildDaily(){
  const info = dailyInfo(), grid = $('dayGrid'); grid.innerHTML = '';
  DAILY.forEach((r, i) => {
    const d = document.createElement('div'); const n = i + 1;
    d.className = 'day' + (n === 7 ? ' big' : '') + (n < info.day || (!info.can && n === info.day) ? ' got' : '') + (info.can && n === info.day ? ' cur' : '');
    d.innerHTML = '<span></span><b>◆ ' + r + '</b>'; d.querySelector('span').textContent = tr('day').replace('{n}', n);
    grid.appendChild(d);
  });
  $('claimBtn').classList.toggle('hidden', !info.can);
  $('dailyBack').classList.toggle('hidden', info.can);
  $('dailyMsg').textContent = info.can ? '' : tr('tomorrow');
}
function claimDaily(){
  const info = dailyInfo(); if(!info.can) return;
  const r = DAILY[info.day - 1];
  gems += r; stats.crystals += r; store.set('gems', gems); saveStats();
  store.set('dailyLast', dayKey(new Date())); store.set('dailyStreak', info.day);
  SFX.mission(); SFX.gem(); vibe(40); flash(.4, '#ffd23d'); punch(.06);
  burst(W/2, H*.45, 60, ['#ffd23d','#29f0ff','#ff3d9a','#fff'], 480, {life:1.2, size:6, g:300, glow:true});
  popup(W/2, H*.2, '+' + r + ' ◆', '#29f0ff', 40);
  buildDaily(); refreshMenu();
}

function fmtTime(s){ s = Math.floor(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  return h ? h + 'h ' + String(m).padStart(2,'0') + 'm' : m + 'm ' + String(sec).padStart(2,'0') + 's'; }
function buildStats(){
  const rows = [['best', best], ['s_games', stats.games], ['s_points', stats.points], ['s_crystals', stats.crystals], ['s_near', stats.near],
    ['s_saws', stats.saws], ['s_lasers', stats.lasers], ['s_bosses', stats.bosses], ['s_powers', stats.powers], ['completed', mDone], ['s_time', fmtTime(stats.time)]];

// ---------- share card ----------
function makeCard(){
  const S = 1080, c = document.createElement('canvas'); c.width = S; c.height = 1350; const g = c.getContext('2d');
  const P = WORLDS[world], sg = g.createLinearGradient(0, 0, 0, 1350);
  sg.addColorStop(0, P.top); sg.addColorStop(.55, P.mid); sg.addColorStop(1, P.bot); g.fillStyle = sg; g.fillRect(0, 0, S, 1350);
  for(let i=0;i<120;i++){ g.globalAlpha = Math.random()*.8; g.fillStyle = '#fff'; const r = Math.random()*4 + 1; g.fillRect(Math.random()*S, Math.random()*900, r, r); }
  g.globalAlpha = 1;
  g.save(); g.shadowColor = P.glow; g.shadowBlur = 120; const sun = g.createLinearGradient(0, 700, 0, 1100); sun.addColorStop(0, P.sun[0]); sun.addColorStop(1, P.sun[1]);
  g.fillStyle = sun; g.beginPath(); g.arc(S*.72, 900, 260, 0, Math.PI*2); g.fill(); g.restore();
  g.fillStyle = P.ground[1]; g.fillRect(0, 1150, S, 200); g.strokeStyle = P.grid; g.lineWidth = 6; g.shadowColor = P.grid; g.shadowBlur = 30; g.beginPath(); g.moveTo(0, 1150); g.lineTo(S, 1150); g.stroke();
  g.lineWidth = 3; g.shadowBlur = 10; for(let x=-600;x<=S+600;x+=120){ g.beginPath(); g.moveTo(S/2 + (x-S/2)*.35, 1150); g.lineTo(S/2 + (x-S/2)*2.2, 1400); g.stroke(); }
  g.shadowBlur = 0;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '900 150px system-ui,-apple-system,Roboto,sans-serif';
  const tg = g.createLinearGradient(0, 80, 0, 260); tg.addColorStop(0, '#fff'); tg.addColorStop(.45, '#ffd23d'); tg.addColorStop(1, '#ff3d9a');
  g.lineWidth = 18; g.strokeStyle = '#2a0b45'; g.strokeText('GLOWBIRD', S/2, 180); g.shadowColor = '#ff3d9a'; g.shadowBlur = 40; g.fillStyle = tg; g.fillText('GLOWBIRD', S/2, 180); g.shadowBlur = 0;
  g.save(); g.translate(S*.36, 560); g.scale(8, 8); drawBird(g, 0, 0, -.2, .8, SKINS[skinIdx], 0, false, hatIdx); g.restore();
  g.font = '900 90px system-ui,sans-serif'; g.fillStyle = '#fff'; g.globalAlpha = .85; g.fillText(tr('score'), S*.72, 430); g.globalAlpha = 1;
  g.font = '900 260px system-ui,sans-serif'; g.lineWidth = 22; g.strokeStyle = '#2a0b45'; g.strokeText(score, S*.72, 610);
  g.shadowColor = '#ff3d9a'; g.shadowBlur = 50; g.fillStyle = '#fff'; g.fillText(score, S*.72, 610); g.shadowBlur = 0;
  g.font = '800 64px system-ui,sans-serif'; g.fillStyle = '#ffd23d'; g.fillText('🏆 ' + tr('best') + ': ' + best, S/2, 1260);
  return c.toDataURL('image/png');
}
function shareScore(){
  const url = makeCard(), text = tr('share_text').replace('{n}', score);
  try{
    if(NATIVE && NATIVE.shareImage){ NATIVE.shareImage(url.split(',')[1], text); return; }
  }catch(e){}
  fetch(url).then(r => r.blob()).then(blob => {
    const file = new File([blob], 'glowbird.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})) return navigator.share({files:[file], text});
    const a = document.createElement('a'); a.href = url; a.download = 'glowbird.png'; a.click();
  }).catch(() => {});
}

bindTap($('claimBtn'), () => claimDaily());
bindTap($('dailyBack'), () => { SFX.click(); toMenu(); });
bindTap($('statsBtn'), () => { SFX.click(); buildStats(); show('stats'); });
bindTap($('statsBack'), () => { SFX.click(); toMenu(); });
bindTap($('setBack'), () => { SFX.click(); toMenu(); });
bindTap($('againBtn'), () => { SFX.click(); toReady(); });
bindTap($('replayBtn'), () => { SFX.click(); startReplay(); });
bindTap($('shareBtn'), () => { SFX.click(); shareScore(); });
bindTap($('homeBtn'), () => { SFX.click(); toMenu(); });
bindTap($('resumeBtn'), () => resumeGame());
bindTap($('quitBtn'), () => { SFX.click(); toMenu(); });
bindTap($('pauseBtn'), () => { SFX.click(); pauseGame(); });

function syncToggles(){ document.querySelectorAll('.toggle[data-k]').forEach(el => el.querySelector('.sw').classList.toggle('on', !!settings[el.dataset.k])); }
document.querySelectorAll('.toggle[data-k]').forEach(el => bindTap(el, () => {
  const k = el.dataset.k; settings[k] = !settings[k]; store.set('settings', settings); syncToggles();
  SFX.click(); Music.setVol(); if(k==='vibe' && settings.vibe) vibe(40); if(k==='shake' && settings.shake) shake(12,.3);
}));

function buildSkins(){
  $('skinGems').textContent = gems;
  $('tabSkins').classList.toggle('on', shopTab === 'skins'); $('tabHats').classList.toggle('on', shopTab === 'hats');
  const grid = $('skinGrid'); grid.innerHTML = '';
  const hats = shopTab === 'hats';
  const items = hats ? HATS.map((cost, i) => ({cost, i})) : SKINS.map((sk, i) => ({cost: sk.cost, i}));
  const names = hats ? (tr('hat_names') || []) : (tr('skins') || []);
  items.forEach(({cost, i}) => {
    const sel = hats ? i === hatIdx : i === skinIdx, owned = hats ? hatsOwned.includes(i) : unlocked.includes(i);
    const d = document.createElement('div'); d.className = 'skin' + (sel ? ' sel' : '');
    const pc = document.createElement('canvas'); pc.width = 128; pc.height = 128; d.appendChild(pc);
    const pctx = pc.getContext('2d'); pctx.scale(2.3, 2.3);
    drawBird(pctx, 28, hats ? 33 : 29, -.1, .5, hats ? SKINS[skinIdx] : SKINS[i], 0, false, hats ? i : hatIdx);
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = names[i] || (hats ? '' : SKINS[i].name); d.appendChild(nm);
    if(!owned){ const l = document.createElement('div'); l.className = 'lock'; l.innerHTML = '🔒<span style="color:'+(gems>=cost?'#29f0ff':'#ff6b9a')+'">◆ '+cost+'</span>'; d.appendChild(l); }
    bindTap(d, () => {
      if(owned){ if(hats){ hatIdx = i; store.set('hat', i); } else { skinIdx = i; store.set('skin', i); } SFX.click(); buildSkins(); }
      else if(gems >= cost){
        gems -= cost; store.set('gems', gems);
        if(hats){ hatsOwned.push(i); store.set('hats', hatsOwned); hatIdx = i; store.set('hat', i); }
        else { unlocked.push(i); store.set('unlocked', unlocked); skinIdx = i; store.set('skin', i); }
        SFX.gem(); SFX.best(); vibe(60); shake(10,.3); flash(.4,'#29f0ff'); buildSkins(); }
      else { SFX.hit(); vibe(30); d.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'none'}], {duration:200}); }
    });
    grid.appendChild(d);
  });
}

// gameplay input
function onTap(){
  if(state === 'ready') startPlay();
  else if(state === 'play') flap();
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); audio(); Music.start(); onTap(); });
$('ready').addEventListener('pointerdown', e => { e.preventDefault(); onTap(); });
addEventListener('keydown', e => { if(e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); audio(); Music.start(); if(state==='menu') toReady(); else if(state==='over') toReady(); else onTap(); } if(e.code==='Escape') window.onBack(); });

// native hooks
window.onBack = function(){
  if(state === 'play' || state === 'ready') pauseGame();
  else if(state === 'pause') resumeGame();
  else if(state === 'replay') endReplay();
  else if(state === 'menu'){
    if(curScreen === 'langs' && langReturn === 'settings'){ syncToggles(); show('settings'); }
    else if(curScreen !== 'menu') toMenu();
    else if(NATIVE && NATIVE.exit) NATIVE.exit();
  }
  else toMenu();
};
window.onAppPause = function(){ pauseGame(); if(ac) ac.suspend(); };
window.onAppResume = function(){ if(ac) ac.resume(); };
document.addEventListener('visibilitychange', () => { if(document.hidden) window.onAppPause(); });

// ---------- loop ----------
let last = performance.now();
function frame(now){
  let dt = (now - last) / 1000; last = now; dt = Math.min(dt, 1/30);
  update(state === 'pause' ? 0 : dt);
  render();
  requestAnimationFrame(frame);
}
applyLang(); resize(); resetRun(); toMenu();
if(dailyInfo().can){ setTimeout(() => { if(curScreen === 'menu'){ buildDaily(); show('daily'); } }, 700); }
requestAnimationFrame(frame);
</script>
